<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Km-kirjaimet: iso K ja pieni m, kuten Kilsamittari. Otsikon fontti ja gradientti -->
  <defs>
    <linearGradient id="km" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <text x="32" y="33" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="url(#km)" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">Km</text>
</svg>
