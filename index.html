  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kilsamittari</title>

    <meta name="description" content="Kilsamittari on kävelypäiväkirja. Kirjaa kävelemäsi kilometrit ja seuraa edistymistäsi päivittäin, viikoittain, kuukausittain ja vuosittain. Ansaitse palkintoja kilometrirajoista." />

    <meta property="og:title" content="Kilsamittari" />
    <meta property="og:description" content="Seuraa kävelyäsi ja motivoidu joka kilometristä." />
    <meta property="og:image" content="https://jaricode.fi/kilsamittari/KilsamittariSome.png" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon-180.png" />
    <style>
      /* Sovelluksen tausta heti, ennen Reactin latautumista, estää valkoisen välähdyksen */
      html,
      body {
        margin: 0;
        background: #0b1120;
      }
      /* Latausanimaatio joka näkyy ennen kuin React on käynnistynyt */
      #alkulataus {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at top, #16233b 0%, #0b1120 55%, #070b14 100%);
      }
      #alkulataus .keha {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(34, 197, 94, 0.25);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: alkuPyoritys 0.8s linear infinite;
      }
      @keyframes alkuPyoritys {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="alkulataus"><div class="keha"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
